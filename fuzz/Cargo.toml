[package]
name = "lattice-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lattice-files = { path = "../crates/lattice-files" }
lattice-events = { path = "../crates/lattice-events" }
lattice-identity = { path = "../crates/lattice-identity" }
lattice-protocol = { path = "../crates/lattice-protocol" }
lattice-sync = { path = "../crates/lattice-sync" }
lattice-relay = { path = "../crates/lattice-relay" }
lattice-crypto = { path = "../crates/lattice-crypto" }
lattice-core = { path = "../crates/lattice-core" }
lattice-mls = { path = "../crates/lattice-mls" }
openmls = "=0.9.0"
lattice-voice = { path = "../crates/lattice-voice" }

# Use independent workspace for fuzzers
[workspace]
members = ["."]

[[bin]]
name = "canonical"
path = "fuzz_targets/canonical.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identity-bundle"
