[package]
name = "lattice-cli"
description = "Command-line client for Lattice"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "lattice"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
lattice-core = { path = "../../crates/lattice-core" }
lattice-platform = { path = "../../crates/lattice-platform" }
directories = "=6.0.0"
serde_json = "1"

[lints]
workspace = true
