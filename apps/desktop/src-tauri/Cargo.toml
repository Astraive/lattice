[package]
name = "lattice-desktop"
description = "Lattice desktop client"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "lattice_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
lattice-core = { path = "../../../crates/lattice-core" }
lattice-platform = { path = "../../../crates/lattice-platform" }
lattice-relay = { path = "../../../crates/lattice-relay" }
lattice-node = { path = "../../../crates/lattice-node" }
lattice-storage = { path = "../../../crates/lattice-storage" }
lattice-transport = { path = "../../../crates/lattice-transport" }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
serde_json = "1"
if-addrs = "=0.13.4"
mdns-sd = "=0.21.4"
uuid = { version = "=1.26.1", features = ["v4"] }

serde = { version = "1", features = ["derive"] }
directories = "=6.0.0"
base64 = "=0.22.1"
lattice-files = { path = "../../../crates/lattice-files" }
fs4 = "=0.13.1"
tauri-plugin-dialog = { version = "=2.7.3", default-features = false }


[lints]
workspace = true
