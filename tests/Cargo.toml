[package]
name = "lattice-scenario-tests"
description = "Deterministic protocol and sync integration scenarios"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
lattice-events = { path = "../crates/lattice-events", version = "=0.1.0" }
lattice-identity = { path = "../crates/lattice-identity", version = "=0.1.0" }
lattice-mesh = { path = "../crates/lattice-mesh", version = "=0.1.0" }
lattice-protocol = { path = "../crates/lattice-protocol", version = "=0.1.0" }
lattice-router = { path = "../crates/lattice-router", version = "=0.1.0" }
lattice-sync = { path = "../crates/lattice-sync", version = "=0.1.0" }
lattice-testkit = { path = "../crates/lattice-testkit", version = "=0.1.0" }
serde_json = "1.0"

[[test]]
name = "protocol_vectors"
path = "protocol/protocol_vectors.rs"

[[test]]
name = "replica_convergence"
path = "sync/replica_convergence.rs"

[[test]]
name = "security_negative"
path = "security/negative_signed_event.rs"

[[test]]
name = "routing_policy"
path = "routing/local_route_policy.rs"

[[test]]
name = "mesh_contact_carry"
path = "mesh/three_peer_contact_carry.rs"
