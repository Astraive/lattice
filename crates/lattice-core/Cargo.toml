[package]
name = "lattice-core"
description = "Lattice command and orchestration facade"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true



[dependencies]
lattice-events = { path = "../lattice-events" }
lattice-files = { path = "../lattice-files" }
lattice-identity = { path = "../lattice-identity" }
lattice-mls = { path = "../lattice-mls" }
lattice-protocol = { path = "../lattice-protocol" }
lattice-storage = { path = "../lattice-storage" }
thiserror = "2"
getrandom = "=0.4.3"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
openmls = "=0.9.0"
zeroize = "=1.9.0"

[dev-dependencies]
openmls = { version = "=0.9.0", features = ["test-utils"] }
openmls_rust_crypto = "=0.6.0"
lattice-mls = { path = "../lattice-mls", features = ["test-utils"] }
lattice-testkit = { path = "../lattice-testkit" }
[lints]
workspace = true
