[package]
name = "lattice-web-wasm"
description = "Rust Core WebAssembly browser profile boundary"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = { version = "=0.10.3", features = ["aes"] }
getrandom = "=0.3.4"
lattice-core = { path = "../lattice-core", version = "=0.1.0" }
lattice-identity = { path = "../lattice-identity", version = "=0.1.0" }
lattice-mls = { path = "../lattice-mls", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
zeroize = "=1.9.0"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
js-sys = "=0.3.105"
openmls = { version = "=0.9.0", features = ["js"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
time = { version = "=0.3.55", features = ["wasm-bindgen"] }

[lints]
workspace = true
