[package]
name = "lattice-relay"
description = "Lattice candidate envelope, NIP-01, and NIP-11 codecs; relay interoperability is unimplemented"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
k256 = { version = "=0.13.4", features = ["schnorr"] }
lattice-events = { path = "../lattice-events", version = "=0.1.0" }
lattice-protocol = { path = "../lattice-protocol", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[lints]
workspace = true
