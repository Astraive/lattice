[package]
name = "lattice-relay"
description = "Lattice candidate envelope, NIP-01/NIP-11 profile validation, and bounded Nostr networking"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
base64 = "=0.23.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
k256 = { version = "=0.13.4", features = ["schnorr"] }
lattice-events = { path = "../lattice-events", version = "=0.1.0" }
lattice-protocol = { path = "../lattice-protocol", version = "=0.1.0" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", features = ["macros", "rt", "time"] }
tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
url = "=2.5.8"


[dev-dependencies]
lattice-identity = { path = "../lattice-identity", version = "=0.1.0" }

[lints]
workspace = true
