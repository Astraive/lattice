[package]
name = "lattice-relay"
description = "Lattice candidate envelope, NIP-01, NIP-11, and relay profile validation"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
base64 = "=0.23.1"
k256 = { version = "=0.13.4", features = ["schnorr"] }
lattice-events = { path = "../lattice-events", version = "=0.1.0" }
lattice-protocol = { path = "../lattice-protocol", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[dev-dependencies]
lattice-identity = { path = "../lattice-identity", version = "=0.1.0" }

[lints]
workspace = true
