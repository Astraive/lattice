[package]
name = "lattice-dev-pki"
description = "Test-only development certificates for Lattice acceptance"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "lattice-dev-pki"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rcgen = { version = "=0.14.10", features = ["x509-parser"] }
time = "=0.3.55"

thiserror = "=2.0.20"
x509-parser = "=0.18.1"
pem = "=4.0.0"

[features]
test-utils = []
