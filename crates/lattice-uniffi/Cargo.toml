[package]
name = "lattice-uniffi"
description = "Lattice mobile binding boundary"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
lattice-core = { path = "../lattice-core" }
lattice-node = { path = "../lattice-node" }
lattice-transport = { path = "../lattice-transport" }
lattice-platform = { path = "../lattice-platform" }
tokio = { version = "=1.53.1", features = ["io-util", "net", "rt", "time"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
lattice-crypto = { path = "../lattice-crypto" }
sha2 = "=0.10.9"
lattice-identity = { path = "../lattice-identity" }
lattice-files = { path = "../lattice-files" }
thiserror = "2"
uniffi = "=0.32.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
