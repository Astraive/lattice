[package]
name = "lattice-uniffi"
description = "Lattice mobile binding boundary"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
lattice-core = { path = "../lattice-core" }
lattice-identity = { path = "../lattice-identity" }
thiserror = "2"
uniffi = "=0.29.4"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
