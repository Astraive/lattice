[workspace]
members = ["apps/cli", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
authors = ["Neeraj Sathish Kumar <neerajcodz@gmail.com>"]
edition = "2024"
rust-version = "1.95"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
