name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint workspace
        run: bun run lint

      - name: Check types and native crates
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Build web assets
        run: bun run build

  android:
    name: Android
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.2" "build-tools;37.0.0" "ndk;28.2.13676358"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Android application
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug

      - name: Upload Android validation reports
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: android-validation-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7.0.1
        if: success()
        with:
          name: android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


  required:
    name: CI required
    if: always()
    needs:
      - workspace
      - android
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI gate to succeed
        env:
          WORKSPACE_RESULT: ${{ needs.workspace.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          set -euo pipefail
          for gate in "workspace:$WORKSPACE_RESULT" "android:$ANDROID_RESULT"; do
            name="${gate%%:*}"
            result="${gate#*:}"
            if [[ "$result" != success ]]; then
              echo "::error::$name gate finished with '$result' (expected success)"
              exit 1
            fi
          done
